<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RallyTime">
  <!-- Pickleball on a transparent canvas. The holes are real cut-outs rather
       than white circles: fill-rule="evenodd" punches the inner subpaths
       through the outer one, so whatever is behind the mark shows through.
       That means it sits correctly on the navy bar, on white, or on any
       future background without needing a second version. -->
