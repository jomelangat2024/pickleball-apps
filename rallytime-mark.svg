    M 40.8,32    a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 34.3,20.74 a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 21.3,20.74 a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 14.8,32    a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 21.3,43.26 a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 34.3,43.26 a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z

    M 48.15,20.25 a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 27.8,8.5    a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 7.45,20.25  a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 7.45,43.75  a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 27.8,55.5   a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
    M 48.15,43.75 a 4.2,4.2 0 1,0 8.4,0 a 4.2,4.2 0 1,0 -8.4,0 Z
