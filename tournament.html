<style>
/* === Village Pickle inspired theme === */
:root {
  --vp-yellow: #c9d936;
  --vp-yellow-dark: #a8b82c;
  --vp-yellow-soft: #e6ed8a;
  --vp-green: #1c8442;
  --vp-green-dark: #15703a;
  --vp-green-soft: #c7e5d4;
  --vp-green-tint: #e6f4ec;
  --vp-navy: #0f1f3a;
  --vp-navy-soft: #1e2f4f;
  --vp-cream: #fdfaf1;
  --vp-coral: #f97048;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--vp-cream) !important;
  color: var(--vp-navy);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: 'Inter', -apple-system, sans-serif; letter-spacing: -0.02em; }

/* Logo strip banner */
body::before {
  content: '';
  display: block;
  height: 6px;
  background: linear-gradient(90deg, var(--vp-yellow) 0%, var(--vp-green) 100%);
}

/* === Override Tailwind primary blues with Village Pickle palette === */
.bg-blue-600 { background-color: var(--vp-navy) !important; }
.bg-blue-700 { background-color: var(--vp-navy) !important; }
.hover\\:bg-blue-700:hover { background-color: var(--vp-navy-soft) !important; }
.hover\\:bg-blue-600:hover { background-color: var(--vp-navy-soft) !important; }
.bg-blue-100 { background-color: var(--vp-yellow-soft) !important; }
.text-blue-600 { color: var(--vp-green) !important; }
.text-blue-700 { color: var(--vp-navy) !important; }
.text-blue-900 { color: var(--vp-navy) !important; }
.bg-blue-50 { background-color: #fdf9d8 !important; }
.border-blue-200 { border-color: var(--vp-yellow-soft) !important; }
.border-blue-400 { border-color: var(--vp-green) !important; }
.hover\\:border-blue-400:hover { border-color: var(--vp-green) !important; }
.hover\\:text-blue-600:hover { color: var(--vp-green) !important; }

/* Header gradient: navy with yellow stripe */
.from-blue-700 { --tw-gradient-from: var(--vp-navy) !important; }
.to-blue-500 { --tw-gradient-to: var(--vp-navy-soft) !important; }
.bg-gradient-to-r {
  background: linear-gradient(90deg, var(--vp-navy) 0%, var(--vp-navy-soft) 100%) !important;
  border-bottom: 4px solid var(--vp-yellow);
}
.text-blue-100 { color: var(--vp-yellow-soft) !important; }

/* Emerald (winner / playoff highlights) -> pickleball yellow-green */
.bg-emerald-50 { background-color: var(--vp-green-tint) !important; }
.bg-emerald-50\/40 { background-color: rgba(230, 244, 236, 0.6) !important; }
.bg-emerald-100 { background-color: var(--vp-green-soft) !important; }
.text-emerald-600 { color: var(--vp-green) !important; }
.text-emerald-700 { color: var(--vp-green-dark) !important; }
.bg-emerald-600 { background-color: var(--vp-green) !important; color: #ffffff !important; }
.hover\\:bg-emerald-700:hover { background-color: var(--vp-green-dark) !important; }
.border-emerald-200 { border-color: var(--vp-green-soft) !important; }

/* Cards get a warmer feel */
.bg-white {
  background-color: #ffffff !important;
  border-color: rgba(15, 31, 58, 0.08);
}
.shadow-sm { box-shadow: 0 1px 3px rgba(15, 31, 58, 0.06), 0 1px 2px rgba(15, 31, 58, 0.04) !important; }
.shadow-md { box-shadow: 0 4px 12px rgba(15, 31, 58, 0.08) !important; }
.shadow-2xl { box-shadow: 0 25px 50px -12px rgba(15, 31, 58, 0.25) !important; }

/* Slate accents pushed toward navy */
.text-slate-900 { color: var(--vp-navy) !important; }
.text-slate-800 { color: var(--vp-navy) !important; }

/* Buttons get more presence */
button { letter-spacing: 0.01em; }

/* Pink accents (mixed) — keep but warm */
.bg-pink-100 { background-color: #ffe0ea !important; }
.text-pink-600 { color: #d63672 !important; }
.text-pink-700 { color: #b02560 !important; }
.bg-pink-50 { background-color: #fff5f8 !important; }
.border-pink-200 { border-color: #fbcfde !important; }

/* Village Pickle bottom stripe band */
.vp-stripes {
  display: block;
  width: 100%;
  height: 96px;
  background: linear-gradient(
    to bottom,
    var(--vp-cream) 0% 4%,
    var(--vp-green) 4% 10%,
    #ffffff 10% 16%,
    var(--vp-green) 16% 22%,
    #ffffff 22% 28%,
    var(--vp-green) 28% 34%,
    #ffffff 34% 40%,
    var(--vp-green) 40% 46%,
    #ffffff 46% 52%,
    var(--vp-green) 52% 58%,
    #ffffff 58% 64%,
    var(--vp-green) 64% 70%,
    #ffffff 70% 75%,
    var(--vp-green) 75% 100%
  );
}
@media print { .vp-stripes { display: none; } }

/* Top brand banner */
.vp-brand-banner {
  background: var(--vp-yellow);
  color: var(--vp-navy);
  font-weight: 700;
  text-align: center;
  padding: 8px 12px;
  font-size: 13px;
  letter-spacing: 0.02em;
}

/* Tab buttons (segmented control) */
.bg-white.p-1.rounded-lg.border {
  background: var(--vp-navy) !important;
  border-color: var(--vp-navy) !important;
}
.bg-white.p-1.rounded-lg.border button {
  color: rgba(255, 255, 255, 0.7) !important;
  transition: background-color 0.15s, color 0.15s;
}
.bg-white.p-1.rounded-lg.border button.bg-blue-600,
.bg-white.p-1.rounded-lg.border button[class*="bg-blue-600"] {
  background: var(--vp-yellow) !important;
  color: var(--vp-navy) !important;
}
/* Segmented control: subtle hover for non-active tabs */
.bg-white.p-1.rounded-lg.border button:hover:not(.bg-blue-600):not([class*="bg-blue-600"]) {
  background-color: rgba(201, 217, 54, 0.18) !important;
  color: #ffffff !important;
}

/* Top-nav division tabs: warm cream hover (override the default slate-100) */
nav .scrollbar-thin button {
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
nav .scrollbar-thin button:hover:not(.bg-blue-100) {
  background-color: var(--vp-yellow-soft) !important;
  color: var(--vp-navy) !important;
}

/* Extra utilities not in pre-compiled Tailwind */
.tracking-widest { letter-spacing: 0.1em; }
.underline { text-decoration: underline; }
.list-disc { list-style-type: disc; }
.list-inside { list-style-position: inside; }
.border-l-4 { border-left-width: 4px; border-left-style: solid; }
.border-l-vp-yellow { border-left-color: var(--vp-yellow); }
.h-8 { height: 2rem; }
.h-10 { height: 2.5rem; }
.h-12 { height: 3rem; }
.h-14 { height: 3.5rem; }
.h-16 { height: 4rem; }
.w-auto { width: auto; }
.drop-shadow-sm { filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); }
@media (min-width: 640px) {
  .sm\:h-12 { height: 3rem; }
  .sm\:h-14 { height: 3.5rem; }
  .sm\:h-16 { height: 4rem; }
}

.court-svg { width: 100%; max-width: 220px; }
.scrollbar-thin::-webkit-scrollbar { height: 8px; width: 8px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--vp-green); border-radius: 4px; }
.scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
@media print {
  .no-print { display: none !important; }
  body { background: white !important; }
  body::before { display: none; }
}
</style>

const FB_CONFIG_KEY = 'vp-fb-config-v1';
const fbState = {

}

  try {
    if (cfg) localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(FB_CONFIG_KEY);
  } catch (e) {}

function setFbStatus(status, message) {
  fbState.status = status;
  fbState.message = message || '';
  fbState.listeners.forEach(function (fn) { try { fn(status, message || ''); } catch (e) {} });
}

async function initFirebase(cfg, onCloudState) {
  if (!cfg || !cfg.apiKey || !cfg.databaseURL) {
    setFbStatus('disabled');
    return false;
  }
  if (typeof firebase === 'undefined') {
    setFbStatus('error', 'Firebase SDK not loaded (check internet)');
    return false;
  }
  try {
    setFbStatus('connecting');
    if (firebase.apps && firebase.apps.length) {
      await firebase.app().delete().catch(function(){});
    }
    fbState.app = firebase.initializeApp(cfg);
    // Optional anonymous auth — skip silently if blocked by CSP/network.
    // Database rules can be set to public read/write so this isn't required.
    try { await firebase.auth().signInAnonymously(); }
    catch (authErr) { console.warn('Firebase anonymous auth skipped:', authErr.message); }
    const tid = cfg.tournamentId || 'default';
    fbState.ref = firebase.database().ref('tournaments/' + tid);
    fbState.ref.on('value', function (snap) {
      const val = snap.val();
      if (val) {
        fbState.lastReceivedJson = JSON.stringify(val);
        try { onCloudState(val); } catch (e) { console.error(e); }
      }
      setFbStatus('connected');
    }, function (err) {
      setFbStatus('error', err.message || String(err));
    });
    fbState.enabled = true;
    return true;
  } catch (e) {
    setFbStatus('error', e.message || String(e));
    console.error('Firebase init failed', e);
    return false;
  }
}

function writeFbState(state) {
  if (!fbState.enabled || !fbState.ref) return;
  const serialized = JSON.stringify(state);
  if (serialized === fbState.lastReceivedJson) return; // echo prevention
  if (fbState.writeTimer) clearTimeout(fbState.writeTimer);
  fbState.writeTimer = setTimeout(function () {
    fbState.ref.set(state).catch(function (e) {
      setFbStatus('error', (e && e.message) || String(e));
    });
  }, 600);
}

async function disconnectFirebase() {
  try { if (fbState.ref) { fbState.ref.off(); fbState.ref = null; } } catch (e) {}

  fbState.lastReceivedJson = null;
  setFbStatus('disabled');
}

function subscribeFbStatus(fn) {
  fbState.listeners.add(fn);
  fn(fbState.status, fbState.message);
  return function () { fbState.listeners.delete(fn); };
}

// Plausible pickleball score: winner reaches 11 (or higher to win by 2), loser 5-9.
function randomGameScore() {
  const loserScore = Math.floor(Math.random() * 5) + 5; // 5..9
  let winnerScore = 11;
  // ~15% chance of going past 11 (deuce-ish)

  return [winnerScore, loserScore];
}

  for (let i = 0; i < 3; i++) {
    const aWinsGame = Math.random() < pA;
    const [w, l] = randomGameScore();
    if (aWinsGame) {
      match.games[i] = { ...match.games[i], teamAScore: w, teamBScore: l };
      aWins++;
    } else {

      bWins++;
    }

  return match;
}

    const base = t.dupr || (10 + Math.random() * 4);

<script>
(function(){
var KEY='pickleball-tournament-v1', API="/api/state/tournament", DIRTY="rt-dirty:"+KEY;
var origSet=localStorage.setItem.bind(localStorage), t=null, pending=null;
function doPut(v,keep){ return fetch(API,{method:"PUT",keepalive:!!keep,headers:{"content-type":"application/json","x-pin":localStorage.getItem("rt-pin")||""},body:JSON.stringify({data:v})}); }
function handle(r,v){ if(r.status===403){ var p=prompt("Enter PIN to save changes:"); if(p!==null&&p!==""){ origSet("rt-pin",p); return doPut(v).then(function(r2){ if(r2.ok) localStorage.removeItem(DIRTY); }); } } else if(r.ok){ localStorage.removeItem(DIRTY); } }
function push(v){ pending=v; clearTimeout(t); t=setTimeout(function(){ pending=null; doPut(v).then(function(r){ return handle(r,v); }).catch(function(){}); },800); }
localStorage.setItem=function(k,v){ origSet(k,v); if(k===KEY){ origSet(DIRTY,"1"); push(v); } };
window.addEventListener("pagehide",function(){ if(pending!==null){ clearTimeout(t); doPut(pending,true).catch(function(){}); pending=null; } });
fetch(API).then(function(r){return r.ok?r.json():null}).then(function(row){
var local=localStorage.getItem(KEY);
if(localStorage.getItem(DIRTY)){ if(local!==null) push(local); return; }
if(!row||typeof row.data!=="string") return;
if(local===row.data){ sessionStorage.removeItem("rt-cloud-sync"); return; }
if(!sessionStorage.getItem("rt-cloud-sync")){ origSet(KEY,row.data); sessionStorage.setItem("rt-cloud-sync","1"); location.reload(); }
else { sessionStorage.removeItem("rt-cloud-sync"); push(local); }
}).catch(function(){});
})();
