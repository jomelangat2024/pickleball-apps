<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thursday Men's League</title>
<style>
  :root {
    --bg: #0f1722;
    --panel: #18222f;
    --panel2: #1f2c3c;
    --line: #2b3a4d;
    --text: #e8eef5;
    --muted: #9fb0c3;
    --accent: #4ade80;
    --accent-d: #22c55e;
    --blue: #38bdf8;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #142033, #0f1722);
    border-bottom: 1px solid var(--line);
    padding: 16px 20px;
  }
  .title { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  .brand { height:46px; width:auto; display:block; }
  .divider { width:1px; height:34px; background:var(--line); }
  .weekchip { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; font-weight:700; color:var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .pill { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; }
  .pill b { color: var(--accent); }

  .preview { margin-top:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted); min-height:26px;}
  .preview .lab { color:#67839e; text-transform:uppercase; letter-spacing:.5px; font-size:11px; }
  .gchip { display:inline-flex; align-items:center; gap:5px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:4px 9px; font-weight:700; color:var(--text); }
  .gchip.four { border-color:#2f5d7a; }
  .gchip.four .n { color:var(--blue); }
  .gchip.five { border-color:#2f6b3f; }
  .gchip.five .n { color:var(--accent); }
  .gchip.odd { border-color:#7a5a1f; }
  .gchip.odd .n { color:var(--warn); }
  .preview .warn { color:var(--warn); }
  input[type=search]{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:8px 12px; border-radius:8px; font-size:14px; min-width:180px; flex:1;
  }
  select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:13px;
  }
  button {
    border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600;
    cursor:pointer; transition:transform .05s ease, filter .15s ease;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background:var(--accent-d); color:#06210f; }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-ghost { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  .btn-ghost:hover { filter:brightness(1.15); }

  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .layout { display:grid; grid-template-columns: 1fr; gap:24px; }
  @media(min-width: 860px){
    .layout{ grid-template-columns: 1fr 1fr; }
    /* collapsed: roster drops out of the grid, groups span full width */
    .layout.roster-collapsed{ grid-template-columns: 1fr; }
  }
  /* collapsed roster sits as a thin row above the groups */
  .layout.roster-collapsed #rosterSection { grid-column: 1 / -1; }
  .collapse-btn { float:right; font-size:12px; font-weight:600; background:var(--panel2); color:var(--muted); border:1px solid var(--line); border-radius:7px; padding:3px 10px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .collapse-btn:hover { color:var(--text); border-color:#3a526b; }
  #rosterSection.collapsed #rosterBody { display:none; }
  #rosterSection.collapsed h2 { display:none; }
  #rosterSection:not(.collapsed) #rosterMini { display:none; }
  .roster-mini { display:inline-flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); cursor:pointer; }
  .roster-mini:hover { border-color:var(--blue); color:var(--text); }
  .roster-mini b { color:var(--accent); }
  .roster-mini .link { color:var(--blue); font-weight:600; }

  h2 { font-size:15px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 12px; }

  .addrow { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .addrow input { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 12px; font-size:14px; }
  .addrow #newName { flex:1; min-width:130px; }
  .addrow #newRating { width:150px; }
  .addrow #addBtn { white-space:nowrap; }
  .addedtag { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); border:1px solid #2f6b3f; border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:1px; }
  .rm { background:transparent; border:none; color:#67839e; font-size:14px; cursor:pointer; padding:2px 4px; line-height:1; }
  .rm:hover { color:#f87171; }
  .roster { display:flex; flex-direction:column; gap:8px; }
  .player {
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .player:hover { border-color:#3a526b; }
  .player.in { background:#16331f; border-color:#2f6b3f; }
  .player.flash { animation:flash 1.5s ease-out; }
  @keyframes flash { 0%{ box-shadow:0 0 0 2px var(--accent); background:#1d4429; } 100%{ box-shadow:none; } }
  .check {
    width:22px;height:22px;border-radius:6px;border:2px solid var(--line);
    flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#06210f;
  }
  .player.in .check { background:var(--accent); border-color:var(--accent); }
  .pname { flex:1; font-weight:600; font-size:14px; }
  .ratings { display:flex; gap:6px; }
  .rb { font-size:12px; padding:2px 7px; border-radius:6px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); white-space:nowrap;}
  .rb .lab { color:#67839e; margin-right:3px; }
  .rb.d .num{ color:var(--blue); font-weight:700;}
  .rb.edit{ cursor:pointer; }
  .rb.edit:hover{ border-color:var(--blue); }
  .nr { opacity:.65; }

  .groups { display:flex; flex-direction:column; gap:14px; }
  .group {
    background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  .ghead { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--panel2); border-bottom:1px solid var(--line);}
  .ghead .gname { font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .ghead .gavg { font-size:12px; color:var(--muted);}
  .ghead .gavg b{ color:var(--accent);}
  .pool-toggle { background:none; border:none; color:var(--blue); cursor:pointer; font-size:12px; font-weight:600; padding:2px 4px; }
  .pool-toggle:hover { text-decoration:underline; }
  .group.pcollapsed .proster { display:none; }
  .grow { display:flex; justify-content:space-between; padding:8px 14px; border-bottom:1px solid #223040; font-size:14px;}
  .grow:last-child{ border-bottom:none; }
  .grow .gr { font-size:12px; color:var(--blue); font-weight:700;}
  .grow .gleft { display:inline-flex; align-items:center; gap:8px; }
  .grec, .nrec { font-size:11px; font-weight:700; color:var(--accent); background:#16331f; border:1px solid #2f6b3f; border-radius:999px; padding:1px 7px; letter-spacing:.3px; margin-left:6px; white-space:nowrap; }
  .partial { color:var(--warn); }
  .five { color:var(--blue); font-size:12px; font-weight:600; }
  .podtag { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); border:1px solid #2f6b3f; border-radius:5px; padding:1px 6px; vertical-align:2px; }

  /* winner trophy */
  .wtrophy { display:none; }
  .team.win, [data-team].win { color:var(--accent); }
  .team.win .wtrophy, [data-team].win .wtrophy { display:inline; margin-left:5px; }
  .team.lose, [data-team].lose { opacity:.55; }
  .match .team.win { position:relative; }
  .byeline { grid-column:1 / -1; font-size:11px; color:var(--warn); padding:0 12px 10px; text-align:center; letter-spacing:.3px;}

  /* match cards */
  .matches { padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--line); background:#13202f;}
  .mtitle { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .livechip { display:inline-block; margin-left:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); border:1px solid #2f6b3f; border-radius:5px; padding:1px 6px; vertical-align:1px; }
  .provtag { display:inline-block; margin-left:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:1px 5px; vertical-align:1px; }
  .stand tr.prov td { opacity:.62; }
  .match {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; overflow:hidden;
  }
  .game-no { grid-column:1 / -1; font-size:11px; color:#67839e; padding:6px 12px 0; font-weight:700; letter-spacing:.5px;}
  .team { padding:10px 12px; }
  .team .pl { font-size:13px; font-weight:600; line-height:1.45; }
  .team.right { text-align:right; }
  .vs { font-size:11px; font-weight:800; color:var(--accent); padding:0 10px; }
  .scorewrap { grid-column:1 / -1; display:flex; gap:8px; align-items:center; justify-content:center; padding:0 12px 10px; }
  .scorewrap input { width:72px; text-align:center; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:12px 8px; font-size:22px; font-weight:700;}
  .scorewrap span{ color:#67839e; font-size:12px;}

  /* standings */
  .standings { margin-top:4px; }
  table.stand { width:100%; border-collapse:collapse; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  table.stand th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:#67839e; padding:7px 10px; background:var(--panel2); border-bottom:1px solid var(--line);}
  table.stand td { padding:7px 10px; border-bottom:1px solid #223040; }
  table.stand tr:last-child td { border-bottom:none; }
  table.stand td:first-child { color:#67839e; width:22px; }
  table.stand tr:first-child td:first-child { color:var(--accent); font-weight:800; }
  table.stand .wl { font-weight:700; }
  table.stand .pos { color:var(--accent); font-weight:700; }
  table.stand .neg { color:#f87171; font-weight:700; }
  table.stand .lead td { background:#16331f; }

  /* courts & live queue */
  #courts:empty { display:none; }
  #courts { margin-bottom:26px; }
  .courts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .court { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .court.empty { border-style:dashed; opacity:.6; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:128px; }
  .court.live { border-color:#2f6b3f; box-shadow:0 0 0 1px rgba(74,222,128,.15); }
  .cnum { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .cnum .cg { color:var(--blue); }
  .cidle { color:#67839e; font-size:14px; }
  /* each team on its own row with its score box beside the name */
  .cteamrow { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:15px; font-weight:600; padding:4px 0; }
  .cteamrow .cteam-name { flex:1; }
  .cteamrow input { width:72px; text-align:center; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:12px 8px; font-size:22px; font-weight:700; }
  .cvs { color:var(--accent); font-size:11px; font-weight:800; margin:2px 0; }
  .cbye { margin-top:8px; font-size:11px; color:var(--warn); }
  .queue { margin-top:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .qlab { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#67839e; }
  .qchip { background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:4px 9px; font-size:12px; font-weight:600; }
  .qchip.next { border-color:var(--blue); color:var(--blue); }
  .qchip.done { border-color:#2f6b3f; color:var(--accent); }
  /* instant hover tooltip showing the matchup */
  .qchip[data-tip] { position:relative; cursor:help; }
  .qchip[data-tip]:hover::after {
    content:attr(data-tip); white-space:pre; position:absolute; left:50%; bottom:calc(100% + 8px);
    transform:translateX(-50%); background:#0b1622; color:var(--text); border:1px solid var(--blue);
    border-radius:8px; padding:8px 11px; font-size:12px; font-weight:600; line-height:1.5;
    text-align:center; z-index:50; box-shadow:0 6px 18px rgba(0,0,0,.45); pointer-events:none;
  }
  .qchip[data-tip]:hover::before {
    content:""; position:absolute; left:50%; bottom:calc(100% + 2px); transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--blue); z-index:50; pointer-events:none;
  }
  .qempty { color:#67839e; font-size:12px; }
  .finish-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn-wa { background:#25D366; color:#04331a; font-size:14px; font-weight:700; border:none; border-radius:8px; padding:9px 16px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn-wa:hover { filter:brightness(1.07); }
  .results-preview { margin-top:12px; }
  .results-preview summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .results-preview pre { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; font-size:12px; color:var(--text); margin-top:8px; max-height:320px; overflow:auto; font-family:ui-monospace,Menlo,Consolas,monospace; }

  /* ad hoc matches */
  #adhocSection { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
  #adhocSection h2 { margin:0 0 4px; }
  .adhoc-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0; }
  .adhoc-form { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .adhoc-teams { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .adhoc-team { display:flex; flex-direction:column; gap:6px; }
  .adhoc-form select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:13px; min-width:150px; }
  .adhoc-form .vs { color:var(--muted); font-weight:700; font-size:13px; padding:0 4px; }
  .adhoc-score { display:flex; align-items:center; gap:6px; }
  .adhoc-score input { width:52px; text-align:center; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px; font-size:14px; }
  .adhoc-list { display:flex; flex-direction:column; gap:8px; }
  .adhoc-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
  .adhoc-row .side { font-weight:600; font-size:13px; }
  .adhoc-row .side.win { color:var(--accent); }
  .adhoc-row .mid { color:var(--muted); font-size:12px; }
  .adhoc-row input { width:46px; text-align:center; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px; font-size:14px; }
  .adhoc-row .rm { margin-left:auto; }
  .rec-grid { display:flex; flex-direction:column; gap:8px; margin:10px 0; }
  .rec-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#12202e; border:1px dashed var(--blue); border-radius:9px; padding:9px 12px; font-size:13px; }
  .rec-row .tier { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--blue); font-weight:700; }
  .rec-row .add { margin-left:auto; }
  .adhoc-empty { color:#67839e; font-size:13px; }
  .seed-ctrl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--text); margin:6px 0 12px; }
  .seed-ctrl input, .seed-ctrl select { text-align:center; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font-size:14px; }
  .seed-ctrl .muted { color:#67839e; font-size:12px; }
  .seed-ctrl .wlbl { display:inline-flex; align-items:center; gap:5px; }
  .seed-ctrl .wlbl input { width:56px; }

  /* this week's games log */
  #weekGamesSection { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
  #weekGamesSection h2 { margin:0 0 4px; }
  .log-list { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .log-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .log-row .log-tag { font-size:10px; text-transform:uppercase; letter-spacing:.4px; font-weight:700; color:var(--blue); min-width:52px; }
  .log-row .log-tag.adhoc { color:var(--accent); }
  .log-row .side { font-weight:600; font-size:13px; flex:1; }
  .log-row .side.b { text-align:right; }
  .log-row .side.win { color:var(--accent); }
  .log-row .mid { color:var(--muted); font-size:12px; }
  .log-row input { width:46px; text-align:center; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px; font-size:14px; }

  /* archived-week totals editor */
  .week-edit { background:var(--panel); border:1px solid var(--blue); border-radius:10px; padding:14px; margin-top:12px; }
  .week-edit h3 { margin:0 0 8px; font-size:15px; }
  table.we-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.we-table th, table.we-table td { padding:5px 6px; text-align:center; border-bottom:1px solid var(--line); }
  table.we-table th:first-child, table.we-table td:first-child { text-align:left; }
  table.we-table input { width:52px; text-align:center; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px; font-size:13px; }
  .week-edit .we-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .weeks-list .qchip { display:inline-flex; align-items:center; gap:8px; }
  .weeks-list .qchip .wk-edit { color:var(--blue); cursor:pointer; font-weight:700; }

  /* season */
  #seasonSection { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
  .season-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .season-head h2 { margin:0; }
  .weeks-list { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .season-foot { margin-top:14px; }
  .movers { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .mover { font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; }
  .mover.up { border-color:#2f6b3f; }
  .mover.down { border-color:#7a3030; }
  table.stand .muted { color:#67839e; }
  .estbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 14px; margin-bottom:14px; font-size:13px; color:var(--text); }
  .estbar #estimate { font-weight:600; }
  .estbar .est-done { color:var(--accent); font-weight:700; }
  .estbar .mpg { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .estbar .estctrls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .estbar .mpg input { width:52px; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 6px; font-size:13px; text-align:center; }
  .estbar .mpg input[type=time] { width:auto; }
  .print-row { display:flex; justify-content:flex-end; margin-bottom:12px; }
  @media print {
    header .bar, #roster, .roster, #search, .print-row button { display:none; }
    body { background:#fff; color:#000; }
    .group, .match, .matches { break-inside: avoid; }
  }
  .empty { color:var(--muted); font-size:14px; padding:30px 14px; text-align:center; border:1px dashed var(--line); border-radius:12px;}
  .note{ color:var(--muted); font-size:12px; margin-top:10px; line-height:1.5;}
</style>
</head>
<body>
<header>
  <div class="title">

// Display name: first name + last initial (e.g. "Beenish F."). Full names stay
// the internal key for records/seeding; this only changes what's shown.
function dispName(full){
  const parts = String(full).trim().split(/\s+/);
  if (parts.length < 2) return full;
  return `${parts[0]} ${parts[parts.length - 1][0]}.`;
}
// Canonical name fixes: legacy/alias name -> current name. Keeps one player's
// record from splitting in two after a rename. (Hannan AJ = Hannan Abdel-Jalil.)
const NAME_ALIASES = { "Hannan AJ": "Hannan Abdel-Jalil", "Wais B": "Chris Howell" };
const canonName = n => NAME_ALIASES[n] || n;

// ---- persistence: survives browser close via localStorage ----
function saveState(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      addedPlayers: PLAYERS.slice(BASE_COUNT),
      checkedIn: [...checkedIn],
      groups: lastGroups ? lastGroups.map(g => g.map(x => x.idx)) : null,
      scores,
      courtState,
      minPerGame,
      startTime,
      archive,
      adhoc,
      seedConf,
      wSeed, wSoW, wDiff,
      rosterCollapsed,
    }));
  } catch(e){ /* storage unavailable */ }
}
function loadState(){
  let raw;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){ return; }
  if (!raw) return;
  let st; try { st = JSON.parse(raw); } catch(e){ return; }
  // restore manually-added players first (appended, so base indices stay stable)
  if (PLAYERS.length === BASE_COUNT) (st.addedPlayers || []).forEach(p => PLAYERS.push(p));
  (st.checkedIn || []).forEach(i => checkedIn.add(i));
  scores = st.scores || {};
  courtState = st.courtState || null;
  if (st.minPerGame > 0) minPerGame = st.minPerGame;
  if (st.startTime) startTime = st.startTime;
  if (Array.isArray(st.archive)) archive = st.archive;
  // normalize any legacy/aliased names in saved history so records don't split
  archive.forEach(wk => {
    (wk.players || []).forEach(p => { p.name = canonName(p.name); });
    if (Array.isArray(wk.pods)) wk.pods = wk.pods.map(pod => pod.map(canonName));
  });
  if (Array.isArray(st.adhoc)) adhoc = st.adhoc.map(m => ({
    a:(m.a||[]).map(canonName), b:(m.b||[]).map(canonName), sa:m.sa ?? "", sb:m.sb ?? ""
  }));
  if ([80,90,95,99].includes(st.seedConf)) seedConf = st.seedConf;
  if (typeof st.wSeed === "number") wSeed = st.wSeed;
  if (typeof st.wSoW === "number") wSoW = st.wSoW;
  if (typeof st.wDiff === "number") wDiff = st.wDiff;
  rosterCollapsed = !!st.rosterCollapsed;
  if (Array.isArray(st.groups)){
    lastGroups = st.groups.map(idxArr =>
      idxArr.map(i => ({ idx:i, p:PLAYERS[i], ...effRating(PLAYERS[i]) }))
    );
  }
}

// collapse / expand the roster (auto-collapses once groups are generated)

  const sec = $("rosterSection"), lay = $("layout"), btn = $("rosterToggle");
  if (!sec) return;
  sec.classList.toggle("collapsed", rosterCollapsed);
  lay.classList.toggle("roster-collapsed", rosterCollapsed);
  if (btn) btn.textContent = rosterCollapsed ? "Show ▸" : "Collapse ▾";
  if (rosterCollapsed) renderRosterMini();
}
function setRosterCollapsed(c){ rosterCollapsed = c; applyRosterCollapsed(); saveState(); }
function renderRosterMini(){
  const el = $("rosterMini");
  if (el) el.innerHTML = `👥 <span class="link">Show roster</span> · <b>${checkedIn.size}</b> in`;
}

// effective rating used for grouping: doubles DUPR, NR treated as 3.0
function effRating(p){
  if (p.d != null) return { val: p.d, exact: true };
  return { val: NR_DEFAULT, exact: false };
}

function renderRoster(){
  const q = $("search").value.trim().toLowerCase();
  const wrap = $("roster");
  wrap.innerHTML = "";
  PLAYERS.forEach((p, i) => {
    if (q && !p.name.toLowerCase().includes(q)) return;
    const row = document.createElement("div");
    row.className = "player" + (checkedIn.has(i) ? " in" : "");
    row.dataset.idx = i;
    row.onclick = () => { checkedIn.has(i) ? checkedIn.delete(i) : checkedIn.add(i); update(); };
    const added = i >= BASE_COUNT;
    const rm = (added && lastGroups == null)
      ? `<button class="rm" title="Remove player" onclick="event.stopPropagation();removePlayer(${i})">✕</button>` : "";
    row.innerHTML = `
      <div class="check">${checkedIn.has(i) ? "✓" : ""}</div>
      <div class="pname">${dispName(p.name)}${added ? ` <span class="addedtag">added</span>` : ""}<span class="nrec" data-name="${p.name.replace(/"/g,'&quot;')}" style="display:none"></span></div>
      <div class="ratings">
        <span class="rb d edit ${p.d==null?'nr':''}" title="Click to update DUPR" onclick="event.stopPropagation();editRating(${i})"><span class="lab">DUPR</span><span class="num">${fmt(p.d)}</span> ✎</span>
        ${rm}
      </div>`;
    wrap.appendChild(row);
  });
}

// Add a walk-in: name + optional DUPR rating (blank = Not Rated). Auto-checks them in.
function addPlayer(){
  const nameEl = $("newName"), ratingEl = $("newRating");
  const name = nameEl.value.trim();
  if (!name){ nameEl.focus(); return; }
  if (lastGroups && !confirm(`Groups are already generated for this week. Add "${name}" to the roster anyway?\n\nThey'll be checked in, but won't be placed in a group until you press "Generate groups" again.`)) return;
  const rv = ratingEl.value.trim();
  let d = null;
  if (rv !== ""){ const n = parseFloat(rv); if (!isNaN(n)) d = n; }
  PLAYERS.push({ name, d, s:null, loc:"" });
  checkedIn.add(PLAYERS.length - 1);
  nameEl.value = ""; ratingEl.value = "";
  $("search").value = "";               // clear any active filter so the new player is visible
  saveState(); update();
  // reveal & highlight the newly added row (it appends to the bottom of the roster)
  const row = $("roster").querySelector(`[data-idx="${PLAYERS.length - 1}"]`);
  if (row){ row.scrollIntoView({ behavior:"smooth", block:"center" }); row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1500); }
  nameEl.focus();
}

// Update a player's DUPR (for the weekly re-import). Blank = Not Rated.
function editRating(i){
  const cur = PLAYERS[i].d == null ? "" : String(PLAYERS[i].d);
  const v = prompt(`DUPR rating for ${PLAYERS[i].name}\n(blank = Not Rated):`, cur);
  if (v === null) return;
  const t = v.trim();
  if (t === "") PLAYERS[i].d = null;
  else { const n = parseFloat(t); if (!isNaN(n)) PLAYERS[i].d = n; }
  saveState(); update();
}
window.editRating = editRating;

// Remove a manually-added player (only before groups are generated, to keep indices safe).
function removePlayer(k){
  if (k < BASE_COUNT || lastGroups != null) return;
  PLAYERS.splice(k, 1);
  const remap = [...checkedIn].filter(i => i !== k).map(i => i > k ? i - 1 : i);
  checkedIn.clear(); remap.forEach(i => checkedIn.add(i));
  saveState(); update();
}
window.removePlayer = removePlayer;

// Live preview of how the current check-ins will split, before Generate is pressed
function renderPreview(){
  const el = $("preview");
  const n = checkedIn.size;
  if (n === 0){ el.innerHTML = `<span class="lab">Plan</span><span>Check players in to see the pool plan.</span>`; return; }
  if (n < 4){ el.innerHTML = `<span class="lab">Plan</span><span class="warn">Need at least 4 checked in (${n} so far).</span>`; return; }
  const sizes = groupSizes(n);
  const fours = sizes.filter(s => s === 4).length;
  const fives = sizes.filter(s => s === 5).length;
  const odd   = sizes.filter(s => s !== 4 && s !== 5);
  const chips = sizes.map(s => {
    const cls = s === 4 ? "four" : s === 5 ? "five" : "odd";
    return `<span class="gchip ${cls}"><span class="n">${s}</span></span>`;
  }).join("");
  let summary = `${sizes.length} pool${sizes.length>1?"s":""}`;
  if (fours) summary += ` · ${fours}×4`;
  if (fives) summary += ` · ${fives}×5`;
  const oddNote = odd.length
    ? ` <span class="warn">— pool of ${odd.join(" & ")} can't run a doubles rotation; handle manually.</span>`
    : "";
  el.innerHTML = `<span class="lab">Plan</span>${chips}<span>${summary}${oddNote}</span>`;
}

function update(){
  $("count").textContent = checkedIn.size;
  $("total").textContent = PLAYERS.length;
  const wk = Math.min(archive.length + 1, SEASON_WEEKS);
  $("weekchip").textContent = `Week ${wk} of ${SEASON_WEEKS}`;
  renderRoster();
  if (rosterCollapsed) renderRosterMini();
  renderPreview();
  renderAdhoc();
  renderWeekGames();
  refreshNameRecords();
  saveState();
}

// Decide group sizes for n checked-in players: as many fours as possible, with
// the leftover tiers bumped to fives, spread evenly across the rating tiers.
// Returns an array of sizes in tier order (top tier first). Covers every count
// >= 4 except 6, 7, 11, which are handled explicitly (those need a group of 3).
function groupSizes(n){
  if (n <= 0) return [];
  const special = { 6:[3,3], 7:[4,3], 11:[4,4,3] };
  if (special[n]) return special[n];
  if (n < 4) return [n];
  const G = Math.floor(n / 4);
  const extra = n - 4 * G;            // 0..3 players beyond all-fours
  const sizes = Array(G).fill(4);
  for (let i = 0; i < extra; i++){    // spread the fives across tiers
    const pos = Math.min(G - 1, Math.floor((i + 0.5) * G / extra));
    sizes[pos] += 1;
  }
  return sizes;
}

// Seed order of player indices for this week.
// Week 1: by DUPR. Weeks 2+: by the composite Rating (see seasonTotals);
// players with no season record yet (brand-new) seed at the bottom by DUPR.
function seedOrder(){
  const present = [...checkedIn];
  const byDupr = arr => arr.map(i => ({ i, ...effRating(PLAYERS[i]) }))
    .sort((a, b) => b.val - a.val).map(o => o.i);
  if (archive.length === 0) return byDupr(present);
  const rank = {}; seasonTotals().forEach((s, idx) => { rank[s.name] = { idx, s }; });
  const ranked = [], fresh = [];
  present.forEach(i => {
    const r = rank[PLAYERS[i].name];
    if (r && (r.s.w + r.s.l) > 0) ranked.push({ i, idx: r.idx }); else fresh.push(i);
  });
  ranked.sort((a, b) => a.idx - b.idx);   // already ranked by composite Rating
  return ranked.map(r => r.i).concat(byDupr(fresh));
}

function generate(){
  poolCollapsed.clear();   // fresh pools start expanded
  const order = seedOrder();
  if (order.length === 0){ lastGroups = []; courtState = null; renderGroups(); renderCourts(); saveState(); return; }
  // pools are formed in seed order — do NOT re-sort
  const list = order.map(i => ({ idx:i, p: PLAYERS[i], ...effRating(PLAYERS[i]) }));
  const sizes = groupSizes(list.length);
  const groups = [];
  let cur = 0;
  sizes.forEach(s => { groups.push(list.slice(cur, cur + s)); cur += s; });
  lastGroups = groups;
  initCourts();
  renderGroups();
  renderCourts();
  setRosterCollapsed(true);   // free up space for pools & courts
  saveState();
}

// ---- live court rotation ----
// Build the queue from playable groups (game 0 each), then fill the courts.
function initCourts(){
  const queue = lastGroups
    .map((g, gi) => ({ g, gi }))
    .filter(o => rotation(o.g.length))
    .map(o => ({ gi:o.gi, gm:0 }));
  const courts = [];
  for (let i = 0; i < COURTS; i++) courts.push(queue.length ? queue.shift() : null);
  courtState = { courts, queue, done: [], active: courts.some(Boolean) };
}

// A game on court `c` finished: send that group to the back of the queue for its
// next game (or mark it done), then pull the next waiting group onto the court.
function advanceCourt(c){
  const slot = courtState.courts[c];
  if (!slot) return;
  const total = rotation(lastGroups[slot.gi].length).length;
  courtState.courts[c] = null;
  const next = slot.gm + 1;
  if (next < total) courtState.queue.push({ gi:slot.gi, gm:next });
  else if (!courtState.done.includes(slot.gi)) courtState.done.push(slot.gi);
  if (courtState.queue.length) courtState.courts[c] = courtState.queue.shift();
  saveState();
  renderCourts();
  // cascade: if the freshly-assigned game was already scored, advance again
  const ns = courtState.courts[c];
  if (ns){
    const a = scores[`g${ns.gi}-${ns.gm}-a`], b = scores[`g${ns.gi}-${ns.gm}-b`];
    if (a != null && b != null && a !== "" && b !== "") advanceCourt(c);
  }
}

// On reload, advance any court whose live game is already complete.
function reconcileCourts(){
  if (!courtState || !courtState.active) return;
  courtState.courts.forEach((s, c) => {
    if (!s) return;
    const a = scores[`g${s.gi}-${s.gm}-a`], b = scores[`g${s.gi}-${s.gm}-b`];
    if (a != null && b != null && a !== "" && b !== "") advanceCourt(c);
  });
}

// Called after any score edit: if the completed game is the one live on a court,
// rotate that court.
function maybeAdvance(key){
  if (!courtState || !courtState.active) return;
  const m = key.match(/^g(\d+)-(\d+)-/);
  if (!m) return;
  const gi = +m[1], gm = +m[2];
  const c = courtState.courts.findIndex(s => s && s.gi === gi && s.gm === gm);
  if (c < 0) return;
  const a = scores[`g${gi}-${gm}-a`], b = scores[`g${gi}-${gm}-b`];
  if (a == null || b == null || a === "" || b === "") return;
  advanceCourt(c);
}

function slotInfo(slot){

// ---- time estimate ----
const gameComplete = (gi, gm) => {
  const a = scores[`g${gi}-${gm}-a`], b = scores[`g${gi}-${gm}-b`];
  return a != null && b != null && a !== "" && b !== "";
};
function fmtMins(m){
  if (m <= 0) return "0 min";
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
// Makespan estimate: bounded by throughput (games / courts) and by the longest
// single group (its games are sequential and can't run in parallel).
function estimate(){
  const playable = lastGroups.filter(g => rotation(g.length));
  const totalGames = playable.reduce((s, g) => s + rotation(g.length).length, 0);
  const effCourts = Math.min(COURTS, playable.length) || 1;
  const maxGroupGames = playable.reduce((m, g) => Math.max(m, rotation(g.length).length), 0);
  const totalMin = Math.max(Math.ceil(totalGames / effCourts), maxGroupGames) * minPerGame;
  let done = 0;
  lastGroups.forEach((g, gi) => {
    if (!rotation(g.length)) return;
    const t = rotation(g.length).length;
    for (let gm = 0; gm < t; gm++) if (gameComplete(gi, gm)) done++;
  });
  const remaining = totalGames - done;
  const remMin = Math.ceil(remaining / effCourts) * minPerGame;
  return { totalGames, totalMin, done, remaining, remMin };
}
function startDate(){
  const m = /^(\d{1,2}):(\d{2})$/.exec(startTime);
  const hh = m ? Math.min(23, +m[1]) : 18, mm = m ? Math.min(59, +m[2]) : 0;
  const d = new Date(); d.setHours(hh, mm, 0, 0); return d;
}

  const courts = Math.min(COURTS, lastGroups.filter(g => rotation(g.length)).length);
  const start = startDate();
  const finish = clock(new Date(start.getTime() + e.totalMin * 60000));
  if (e.remaining <= 0){
    el.innerHTML = `<span class="est-done">All ${e.totalGames} games complete</span> · planned ${clock(start)}–${finish}`;
    return;
  }
  const progress = e.done > 0 ? ` · ${e.done}/${e.totalGames} played, ~${fmtMins(e.remMin)} to go` : "";
  el.innerHTML = `⏱ ~${fmtMins(e.totalMin)} · ${e.totalGames} games on ${courts} court${courts>1?"s":""} · `
    + `starts ${clock(start)} → finishes ~${finish}${progress}`;
}

// then within each quartet pair (1&4 vs 2&3) for a balanced game.
function renderRecommendations(){
  const area = $("recArea"); if (!area) return;
  const present = [...checkedIn].map(i => PLAYERS[i].name);
  if (present.length < 4){ area.innerHTML = `<div class="adhoc-empty">Check in at least 4 players to get match recommendations.</div>`; return; }
  const wr = weekRecMap();
  const pct = n => { const r = wr[n]; return r && (r.w + r.l) ? r.w / (r.w + r.l) : 0; };
  const played = n => { const r = wr[n]; return r ? r.played : 0; };
  const fmtPct = n => { const r = wr[n]; const t = r ? r.w + r.l : 0; return t ? Math.round(r.w / t * 100) + "%" : "—"; };
  const sorted = present.slice().sort((a, b) => pct(b) - pct(a) || played(b) - played(a) || dispName(a).localeCompare(dispName(b)));
  const recs = [];
  for (let i = 0; i + 3 < sorted.length; i += 4){
    const q = sorted.slice(i, i + 4);
    recs.push({ a:[q[0], q[3]], b:[q[1], q[2]], tier: Math.floor(i / 4) + 1 });
  }
  const leftover = sorted.slice(recs.length * 4);
  let html = `<div class="note" style="margin:6px 0">Balanced doubles among players with similar records this week (win %). Top group first.</div><div class="rec-grid">`;
  html += recs.map((r, ri) => `<div class="rec-row">

      <button class="btn-ghost add" onclick="addRecommended(${ri})">+ Add</button>
    </div>`).join("");
  html += `</div>`;
  if (recs.length) html += `<div class="adhoc-actions"><button class="btn-primary" id="recAddAll">+ Add all ${recs.length}</button></div>`;
  if (leftover.length) html += `<div class="adhoc-empty">Not enough for a full group: ${leftover.map(dispName).join(", ")}.</div>`;
  area.innerHTML = html;
  area._recs = recs;

// Recompute an archived week's players + pods from its games snapshot (after an edit).
function recomputeArchivedWeek(wi){
  const wk = archive[wi]; if (!wk || !wk.games) return;
  const gm2 = {}; const add = (name, w, l, pf, pa) => {
    const s = gm2[name] || (gm2[name] = { name, w:0, l:0, pf:0, pa:0, played:0 });
    s.w += w; s.l += l; s.pf += pf; s.pa += pa; s.played++;
  };
  const pods = [];
  (wk.games.pools || []).forEach((pool, gi) => {
    const rot = rotation(pool.length); if (!rot) return;
    const podRec = {}; const padd = (name,w,l,pf,pa)=>{ const s=podRec[name]||(podRec[name]={name,w:0,l:0,pf:0,pa:0,played:0}); s.w+=w;s.l+=l;s.pf+=pf;s.pa+=pa;s.played++; };
    rot.forEach((g, idx) => {
      const a = wk.games.scores[`g${gi}-${idx}-a`], b = wk.games.scores[`g${gi}-${idx}-b`];
      if (a == null || a === "" || b == null || b === "") return;
      const sa = +a, sb = +b; if (isNaN(sa) || isNaN(sb)) return;
      const tie = sa === sb, aWin = sa > sb;
      g.a.forEach(i => { add(pool[i], tie?0:(aWin?1:0), tie?0:(aWin?0:1), sa, sb); padd(pool[i], tie?0:(aWin?1:0), tie?0:(aWin?0:1), sa, sb); });
      g.b.forEach(i => { add(pool[i], tie?0:(aWin?0:1), tie?0:(aWin?1:0), sb, sa); padd(pool[i], tie?0:(aWin?0:1), tie?0:(aWin?1:0), sb, sa); });
    });
    const podRows = Object.values(podRec).map(r => ({ ...r, diff:r.pf-r.pa }));
    podRows.sort(seasonCmp);
    pods.push(podRows.length ? podRows.map(r => r.name) : pool.slice());
  });
  (wk.games.adhoc || []).forEach(m => {
    if (m.sa === "" || m.sb === "" || m.sa == null || m.sb == null) return;
    const sa = +m.sa, sb = +m.sb; if (isNaN(sa) || isNaN(sb)) return;
    const tie = sa === sb, aWin = sa > sb;
    (m.a || []).forEach(n => add(canonName(n), tie?0:(aWin?1:0), tie?0:(aWin?0:1), sa, sb));
    (m.b || []).forEach(n => add(canonName(n), tie?0:(aWin?0:1), tie?0:(aWin?1:0), sb, sa));
  });
  wk.players = Object.values(gm2).filter(r => r.played > 0).map(r => ({
    name:r.name, w:r.w, l:r.l, diff:r.pf - r.pa, pf:r.pf, pa:r.pa, played:r.played,
    dupr: (PLAYERS.find(p => p.name === r.name) || {}).d ?? null
  }));
  wk.pods = pods;
}

// Raw win% as a 0-1 rate (shown for reference).
const winPct = s => (s.w + s.l) ? s.w / (s.w + s.l) : 0;
// z-score for the chosen confidence level.
const Z_TABLE = { 80:1.2816, 90:1.6449, 95:1.9600, 99:2.5758 };
const seedZ = () => Z_TABLE[seedConf] || 1.96;
// Seed rating = Wilson score lower bound of the win rate. It rewards a high win % MORE
// when it's backed by more games: extra games shrink the uncertainty and lift the bound,
// so a proven record can outrank an unproven hot streak. Higher confidence = games matter more.
const adjWin = s => {
  const n = s.w + s.l; if (!n) return 0;
  const z = seedZ(), p = s.w / n;
  return (p + z*z/(2*n) - z*Math.sqrt((p*(1-p) + z*z/(4*n))/n)) / (1 + z*z/n);
};
// Point differential per game (volume-neutral) instead of raw total diff.
const diffPerGame = s => s.played ? s.diff / s.played : 0;
// Average rating of a pool (Not Rated players count as NR_DEFAULT).
function poolStrength(names){
  if (!names || !names.length) return NR_DEFAULT;
  const vals = names.map(n => { const p = PLAYERS.find(x => x.name === canonName(n)); return p && p.d != null ? p.d : NR_DEFAULT; });
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
// Strength of Wins: average strength of the pools where a player earned their wins,
// across archived weeks. Higher = beat tougher competition. (Pools are seeded by skill,
// so a win in the top pool weighs more than one in a lower pool.)
// ---- current (in-progress) week, computed live from the board ----
// Same shape as an archived week's { players, pods }, so the season roll-up
// can fold tonight's games in before they're archived.
function currentWeekResult(){
  const players = [];
  const pods = [];
  (lastGroups || []).forEach((g, gi) => {
    if (!rotation(g.length)) return;
    const duprByName = {};
    g.forEach(x => { duprByName[x.p.name] = x.p.d; });
    const rec = computeStandings(gi);
    pods.push(rec.map(r => r.name));
    rec.forEach(r => {
      if (r.played > 0) players.push({ name:r.name, w:r.w, l:r.l, diff:r.diff, pf:r.pf, pa:r.pa, played:r.played, dupr: duprByName[r.name] ?? null });
    });
  });
  // fold ad hoc doubles into the same weekly totals (by player name)
  Object.entries(adhocRecMap()).forEach(([name, r]) => {
    const diff = r.pf - r.pa;
    const existing = players.find(p => p.name === name);
    if (existing){
      existing.w += r.w; existing.l += r.l; existing.diff += diff;
      existing.pf += r.pf; existing.pa += r.pa; existing.played += r.played;
    } else {
      const pl = PLAYERS.find(p => p.name === name);
      players.push({ name, w:r.w, l:r.l, diff, pf:r.pf, pa:r.pa, played:r.played, dupr: pl ? (pl.d ?? null) : null });
    }
  });
  return { players, pods };
}
function hasLiveResults(){ return currentWeekResult().players.length > 0; }
// archive, optionally plus tonight's in-progress week as a synthetic trailing week
function seasonWeeks(includeLive){
  if (!includeLive) return archive;
  const cw = currentWeekResult();
  if (!cw.players.length) return archive;
  return archive.concat([{ date:"Tonight (live)", label:`Week ${archive.length+1}`, players:cw.players, pods:cw.pods, live:true }]);
}

function seasonSoW(includeLive){
  const acc = {};
  const add = (name, wins, strength) => {
    if (wins <= 0) return;
    const s = acc[name] || (acc[name] = { wins:0, wstr:0 });
    s.wins += wins; s.wstr += wins * strength;
  };
  seasonWeeks(includeLive).forEach(wk => {
    const memberPS = {};
    (wk.pods || []).forEach(pool => { const ps = poolStrength(pool); pool.forEach(n => memberPS[canonName(n)] = ps); });
    (wk.players || []).forEach(p => { const ps = memberPS[canonName(p.name)]; if (ps != null) add(canonName(p.name), p.w, ps); });
  });
  const out = {};
  Object.entries(acc).forEach(([n, s]) => out[n] = s.wins ? +(s.wstr / s.wins).toFixed(3) : 0);
  return out;
}
// Lexicographic fallback (used for pod finish order and exact-tie breaks).
const seasonCmp = (a, b) =>
  adjWin(b) - adjWin(a) || (b.sow || 0) - (a.sow || 0) || diffPerGame(b) - diffPerGame(a) || b.played - a.played || b.w - a.w || a.l - b.l;
// Composite Rating (0-100): blend Seed rating, strength of wins, and diff/game. Each factor
// is scaled 0-1 across the field (min→max), then weighted by the (normalized) weights and
// summed. This is a single number that moves with ALL three factors, not just tiebreakers.
function computeRatings(rows){
  const field = rows.filter(r => r.played > 0);
  const scaler = getVals => {
    const vals = field.map(getVals);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    return x => (mx > mn ? (x - mn) / (mx - mn) : 0.5);
  };
  const nSeed = scaler(r => adjWin(r));
  const nSoW  = scaler(r => r.sow || 0);
  const nDiff = scaler(r => diffPerGame(r));
  const tot = (wSeed + wSoW + wDiff) || 1;
  const ws = wSeed / tot, wo = wSoW / tot, wd = wDiff / tot;
  rows.forEach(r => {
    r.rating = r.played > 0
      ? +((ws * nSeed(adjWin(r)) + wo * nSoW(r.sow || 0) + wd * nDiff(diffPerGame(r))) * 100).toFixed(1)
      : 0;
  });
}
function seasonTotals(includeLive){
  const by = {};
  seasonWeeks(includeLive).forEach(wk => wk.players.forEach(p => {
    const s = by[p.name] || (by[p.name] = { name:p.name, w:0, l:0, diff:0, pf:0, pa:0, played:0, weeks:0, firstDupr:null, lastDupr:null, duprWeeks:0 });
    s.w += p.w; s.l += p.l; s.diff += p.diff; s.pf += (p.pf || 0); s.pa += (p.pa || 0); s.played += p.played; s.weeks += 1;
    if (p.dupr != null){ if (s.firstDupr == null) s.firstDupr = p.dupr; s.lastDupr = p.dupr; s.duprWeeks++; }
  }));
  // DUPR movement = latest rating - first recorded rating (needs >= 2 rated weeks)
  Object.values(by).forEach(s => { s.dDupr = s.duprWeeks >= 2 ? +(s.lastDupr - s.firstDupr).toFixed(3) : null; });
  // strength of wins, then the composite Rating
  const sowMap = seasonSoW(includeLive);
  const list = Object.values(by);
  list.forEach(s => { s.sow = sowMap[s.name] || 0; });
  computeRatings(list);
  // ranked by composite Rating (with a lexicographic fallback for exact ties)
  return list.sort((a, b) => (b.rating - a.rating) || seasonCmp(a, b));
}
// Performance vs DUPR expectation. DUPR gives an expected finishing order; actual results
// (rows, already sorted by seasonCmp) give the real order. The gap = how many places a
// player is beating (or missing) their rating. Only players with a DUPR are assessed.
function performanceMap(rows){
  const duprOf = name => { const p = PLAYERS.find(x => x.name === name); return p && p.d != null ? p.d : null; };
  const rated = rows.filter(r => duprOf(r.name) != null);
  const actualRank = {}; rated.forEach((r, i) => actualRank[r.name] = i + 1);
  const expRank = {};
  rated.slice().sort((a, b) => duprOf(b.name) - duprOf(a.name)).forEach((r, i) => expRank[r.name] = i + 1);
  const thr = Math.max(2, Math.round(rated.length * 0.15));   // ~15% of the field, min 2 places
  const map = {};
  rated.forEach(r => {
    const delta = expRank[r.name] - actualRank[r.name];        // + = finishing above DUPR expectation
    map[r.name] = { delta, label: delta >= thr ? "over" : delta <= -thr ? "under" : "expected" };
  });
  return map;
}
function renderSeason(){
  const el = $("season");
  if (!el) return;
  const wkNum = Math.min(archive.length + 1, SEASON_WEEKS);

    <button class="btn-primary" onclick="endWeek()">End week &amp; archive →</button></div>`;

  if (archive.length === 0 && !live){
    html += `<div class="note" style="margin:0">No weeks archived yet. After tonight's play, press <b>End week &amp; archive</b> to save results and start Week 2 — the season leaderboard builds here.</div>`;
    el.innerHTML = html;

  }
  const rows = seasonTotals(true);
  // Form (DUPR over/under) is computed on competitive (rating) order, before the
  // provisional demotion below, so a winning newcomer isn't mislabeled "Under".
  const pm = performanceMap(rows);
  // Minimum-games qualifier (display only — does NOT affect pod seeding):
  // players below the games threshold are "provisional" and sort below everyone
  // who has qualified, no matter how good their short-sample record looks.
  const qualified = r => r.played >= MIN_QUAL_GAMES;
  rows.sort((a, b) => (qualified(b) - qualified(a)) || (b.rating - a.rating) || seasonCmp(a, b));
  let qRank = 0;   // running rank among qualified players only
  // biggest DUPR movers (up and down) + biggest over/under performer vs DUPR
  const movers = rows.filter(r => r.dDupr != null && r.dDupr !== 0);
  const fmtD = v => `${v > 0 ? "+" : "−"}${Math.abs(v).toFixed(3)}`;
  let moverHtml = "";
  const parts = [];
  if (movers.length){
    const up = movers.reduce((a,b) => b.dDupr > a.dDupr ? b : a);
    const down = movers.reduce((a,b) => b.dDupr < a.dDupr ? b : a);
    if (up.dDupr > 0) parts.push(`<span class="mover up">📈 Most improved: <b>${dispName(up.name)}</b> ${fmtD(up.dDupr)} DUPR</span>`);

  }

  if (perfRows.length){
    const best = perfRows.reduce((a,b) => pm[b.name].delta > pm[a.name].delta ? b : a);
    const worst = perfRows.reduce((a,b) => pm[b.name].delta < pm[a.name].delta ? b : a);

    if (pm[worst.name].delta <= -2) parts.push(`<span class="mover down">🧊 Underperforming: <b>${dispName(worst.name)}</b> −${Math.abs(pm[worst.name].delta)} vs DUPR</span>`);
  }
  if (parts.length) moverHtml = `<div class="movers">${parts.join("")}</div>`;
  html += `<div class="mtitle">Season leaderboard · ${archive.length} week${archive.length===1?"":"s"} played${live?` <span class="livechip">+ Week ${archive.length+1} live</span>`:""}</div>

        <option value="99"${seedConf==99?' selected':''}>Max</option>

    <div class="seed-ctrl">Rating weights:

      <span class="muted">how much each factor counts toward the overall Rating (auto-normalized).</span></div>

      <tbody>

          const seedPct = Math.round(adjWin(r) * 100);

            : perf.label === "under" ? `<span class="neg" title="Finishing ${Math.abs(perf.delta)} place${Math.abs(perf.delta)>1?'s':''} below DUPR expectation">▼ Under −${Math.abs(perf.delta)}</span>`

    <div class="weeks-list">${archive.map((wk, wi) => `<span class="qchip">${wk.label} · ${wk.date} · ${wk.players.length} players <span class="wk-edit" onclick="editWeek(${wi})" title="Edit this week's totals">✎ edit</span></span>`).join("")}</div>
    <div id="weekEditor"></div>

  el.innerHTML = html;

        return `<span class="qchip${i===0?' next':''}" data-tip="${tip.replace(/"/g,'&quot;')}">Pool ${q.gi+1} · G${q.gm+1}</span>`;
      }).join("")
    : `<span class="qempty">— none waiting —</span>`;
  const doneHtml = courtState.done.length
    ? `<div class="queue"><span class="qlab">Finished</span>${courtState.done.map(gi => `<span class="qchip done">Pool ${gi+1} ✓</span>`).join("")}</div>`
    : "";
  el.innerHTML = `<h2>Courts (${COURTS}) · Live rotation</h2>${estBar}
    <div class="courts-grid">${courtsHtml}</div>
    <div class="queue"><span class="qlab">Up next</span>${queueHtml}</div>
    ${doneHtml}`;
  renderEstimate();
  paintAllWinners();
}

// Partner rotations. Each game: team a vs team b; `bye` rests (size-5 only).
// 4 players -> 3 games, everyone partners once, faces each other twice.
const ROT4 = [
  { a:[0,1], b:[2,3] },
  { a:[0,2], b:[1,3] },
  { a:[0,3], b:[1,2] },
];
// 5 players -> 5 games, everyone partners once, plays 4 games, rests exactly 1.
const ROT5 = [
  { a:[1,4], b:[2,3], bye:0 },
  { a:[2,0], b:[3,4], bye:1 },
  { a:[3,1], b:[4,0], bye:2 },
  { a:[4,2], b:[0,1], bye:3 },
  { a:[0,3], b:[1,2], bye:4 },
];
const rotation = n => n === 4 ? ROT4 : n === 5 ? ROT5 : null;

function matchCardsHTML(g, gi){
  const rot = rotation(g.length);
  if (!rot){
    return `<div class="matches"><div class="mtitle">Match cards</div>
      <div class="note" style="margin:0">Round-robin rotation supports groups of 4 or 5. This group has ${g.length} — adjust check-ins, or run it manually.</div></div>`;
  }
  const nm = i => g[i].p.name;
  const pl = i => `${dispName(nm(i))}<span class="nrec" data-name="${nm(i).replace(/"/g,'&quot;')}" style="display:none"></span>`;
  const sv = k => scores[k] != null ? ` value="${scores[k]}"` : "";
  const games = rot.map((gm, idx) => {
    const ka = `g${gi}-${idx}-a`, kb = `g${gi}-${idx}-b`;
    const bye = gm.bye != null ? `<div class="byeline">Resting: ${pl(gm.bye)}</div>` : "";
    return `
      <div class="match" data-match="${gi}-${idx}">
        <div class="game-no">Game ${idx+1}</div>
        <div class="team" data-team="a"><div class="pl">${pl(gm.a[0])}</div><div class="pl">${pl(gm.a[1])}</div><span class="wtrophy">🏆</span></div>
        <div class="vs">VS</div>
        <div class="team right" data-team="b"><div class="pl">${pl(gm.b[0])}</div><div class="pl">${pl(gm.b[1])}</div><span class="wtrophy">🏆</span></div>
        <div class="scorewrap"><input type="number" min="0" placeholder="–" data-score="${ka}"${sv(ka)}> <span>to</span> <input type="number" min="0" placeholder="–" data-score="${kb}"${sv(kb)}></div>
        ${bye}
      </div>`;
  }).join("");
  const tag = g.length === 5
    ? "5 games · everyone partners once · one rests each game"
    : "3 games · everyone partners once";
  return `<div class="matches"><div class="mtitle">Match cards · ${tag}</div>${games}`
    + `<div class="standings" id="standings-${gi}"></div></div>`;
}

// Which side won a given game: "a", "b", or null (incomplete/tied)
function winnerSide(gi, gm){
  const a = scores[`g${gi}-${gm}-a`], b = scores[`g${gi}-${gm}-b`];
  if (a == null || b == null || a === "" || b === "") return null;
  const na = +a, nb = +b;
  if (isNaN(na) || isNaN(nb) || na === nb) return null;
  return na > nb ? "a" : "b";
}
// Mark the winning team with a trophy anywhere this game is shown (match + court cards)
function paintWinner(gi, gm){
  const w = winnerSide(gi, gm);
  document.querySelectorAll(`[data-match="${gi}-${gm}"]`).forEach(box => {
    box.querySelectorAll("[data-team]").forEach(t => {
      t.classList.toggle("win", w !== null && t.dataset.team === w);
      t.classList.toggle("lose", w !== null && t.dataset.team !== w);
    });
  });
}
function paintAllWinners(){
  if (!lastGroups) return;
  lastGroups.forEach((g, gi) => {
    const rot = rotation(g.length);
    if (rot) rot.forEach((_, gm) => paintWinner(gi, gm));
  });
}

// Tally W-L and point differential for a group from entered scores
function computeStandings(gi){
  const g = lastGroups[gi];
  const rot = rotation(g.length) || [];
  const rec = g.map(x => ({ name:x.p.name, w:0, l:0, pf:0, pa:0, played:0 }));
  let gamesEntered = 0;
  rot.forEach((gm, idx) => {
    const av = scores[`g${gi}-${idx}-a`], bv = scores[`g${gi}-${idx}-b`];
    if (av == null || bv == null || av === "" || bv === "") return;
    const sa = +av, sb = +bv;
    if (isNaN(sa) || isNaN(sb)) return;
    gamesEntered++;
    const winA = sa > sb, tie = sa === sb;
    gm.a.forEach(i => { rec[i].pf += sa; rec[i].pa += sb; rec[i].played++; if(!tie) (winA?rec[i].w++:rec[i].l++); });
    gm.b.forEach(i => { rec[i].pf += sb; rec[i].pa += sa; rec[i].played++; if(!tie) (winA?rec[i].l++:rec[i].w++); });
  });
  rec.forEach(r => r.diff = r.pf - r.pa);
  rec.sort((a,b) => b.w - a.w || b.diff - a.diff || b.pf - a.pf);
  rec.totalGames = rot.length;
  rec.gamesEntered = gamesEntered;
  return rec;
}

// Tally ad hoc doubles results into a name -> {w,l,pf,pa,played} map (completed only).
function adhocRecMap(){
  const map = {};
  const add = (name, w, l, pf, pa) => {
    const s = map[name] || (map[name] = { w:0, l:0, pf:0, pa:0, played:0 });
    s.w += w; s.l += l; s.pf += pf; s.pa += pa; s.played++;
  };
  adhoc.forEach(m => {
    if (m.sa === "" || m.sb === "" || m.sa == null || m.sb == null) return;
    const sa = +m.sa, sb = +m.sb;
    if (isNaN(sa) || isNaN(sb)) return;
    const tie = sa === sb, aWin = sa > sb;
    (m.a || []).forEach(n => add(canonName(n), tie?0:(aWin?1:0), tie?0:(aWin?0:1), sa, sb));
    (m.b || []).forEach(n => add(canonName(n), tie?0:(aWin?0:1), tie?0:(aWin?1:0), sb, sa));
  });
  return map;
}
// This week's record only (pool games + ad hoc), excluding archived season history.
function weekRecMap(){
  const map = {};
  const add = (name, w, l, played) => {
    const s = map[name] || (map[name] = { w:0, l:0, played:0 });
    s.w += w; s.l += l; s.played += played;
  };
  if (lastGroups) lastGroups.forEach((g, gi) => {
    if (!rotation(g.length)) return;
    computeStandings(gi).forEach(r => add(r.name, r.w, r.l, r.played));
  });
  Object.entries(adhocRecMap()).forEach(([n, r]) => add(n, r.w, r.l, r.played));
  return map;
}
// Cumulative W–L per player = archived weeks (season history) + tonight's live games + ad hoc.
function playerRecMap(){
  const map = {};
  const add = (name, w, l, played) => {
    const s = map[name] || (map[name] = { w:0, l:0, played:0 });
    s.w += w; s.l += l; s.played += played;
  };
  archive.forEach(wk => wk.players.forEach(p => add(p.name, p.w, p.l, p.played)));
  if (lastGroups) lastGroups.forEach((g, gi) => {
    if (!rotation(g.length)) return;
    computeStandings(gi).forEach(r => add(r.name, r.w, r.l, r.played));
  });
  Object.entries(adhocRecMap()).forEach(([n, r]) => add(n, r.w, r.l, r.played));
  return map;
}
// Plain-text record suffix, e.g. " (2–1)" — for court cards & hover tooltips.
function recSuffix(name){
  const r = playerRecMap()[name];
  if (!r || r.played <= 0) return "";
  const tot = r.w + r.l, pct = tot ? Math.round(r.w / tot * 100) : 0;
  return ` (${r.w}–${r.l} · ${pct}%)`;
}
// Update every .nrec badge in the DOM from cumulative records (live, one pass).
function refreshNameRecords(){
  const recs = playerRecMap();
  const wks = archive.length;
  document.querySelectorAll(".nrec").forEach(el => {
    const r = recs[el.dataset.name];
    if (r && r.played > 0){
      const tot = r.w + r.l, pct = tot ? Math.round(r.w / tot * 100) : 0;
      el.textContent = `${r.w}–${r.l} · ${pct}%`;
      el.title = wks ? `Season record (W${wks+1 <= SEASON_WEEKS ? ", incl. tonight" : ""}): ${r.w}–${r.l} (${pct}% wins)` : `Tonight: ${r.w}–${r.l} (${pct}% wins)`;
      el.style.display = "";
    }
    else { el.textContent = ""; el.title = ""; el.style.display = "none"; }
  });
}
// kept for existing call sites
function renderGroupRecords(){ refreshNameRecords(); }

function renderStandings(gi){
  const el = document.getElementById(`standings-${gi}`);
  if (!el) return;
  const rec = computeStandings(gi);
  if (!rec.some(r => r.played > 0)){
    el.innerHTML = `<div class="mtitle">Standings</div><div class="note" style="margin:2px 0 0">Enter scores above to rank this group.</div>`;
    return;
  }
  const complete = rec.gamesEntered === rec.totalGames;
  el.innerHTML = `<div class="mtitle">Standings${complete?" · final":" · in progress"}</div>
    <table class="stand">
      <thead><tr><th>#</th><th>Player</th><th>W–L</th><th>Win%</th><th>Diff</th></tr></thead>
      <tbody>
        ${rec.map((r,i) => {
          const tot = r.w + r.l, pct = tot ? Math.round(r.w / tot * 100) : 0;
          return `
          <tr class="${i===0 && r.w>0 ? 'lead':''}">
            <td>${i+1}</td>
            <td>${dispName(r.name)}</td>
            <td class="wl">${r.w}–${r.l}</td>
            <td>${pct}%</td>
            <td class="${r.diff>0?'pos':r.diff<0?'neg':''}">${r.diff>0?'+':''}${r.diff}</td>
          </tr>`; }).join("")}
      </tbody>
    </table>`;
}

// Collapse/expand a pool's player-name list (toggles in place — no re-render, so
// match-card score inputs keep their focus).
function togglePool(gi){
  const card = document.querySelectorAll("#groups .group")[gi];
  if (!card) return;
  const now = card.classList.toggle("pcollapsed");
  if (now) poolCollapsed.add(gi); else poolCollapsed.delete(gi);
  const btn = card.querySelector(".pool-toggle");
  if (btn) btn.textContent = now ? "Show players ▸" : "Hide players ▾";
}
window.togglePool = togglePool;

function renderGroups(){
  const wrap = $("groups");
  wrap.innerHTML = "";
  if (lastGroups == null){
    wrap.innerHTML = `<div class="empty">Check players in, then press <b>Generate groups</b>.</div>`;
    $("legend").textContent = "";
    return;
  }
  if (lastGroups.length === 0){
    wrap.innerHTML = `<div class="empty">No one is checked in yet.</div>`;
    return;
  }
  const cont = document.createElement("div");
  cont.className = "groups";
  lastGroups.forEach((g, gi) => {
    const avg = g.reduce((s,x)=>s+x.val,0)/g.length;
    const odd = !rotation(g.length);            // not 4 or 5 -> flag it
    const sizeLabel = g.length === 5
      ? ` <span class="five">(5 — rotating bye)</span>`
      : odd ? ` <span class="partial">(${g.length} players)</span>` : "";
    const card = document.createElement("div");
    card.className = "group" + (poolCollapsed.has(gi) ? " pcollapsed" : "");
    const collapsed = poolCollapsed.has(gi);
    card.innerHTML = `
      <div class="ghead">
        <span class="gname">Pool ${gi+1}${gi===0?' <span class="podtag">top</span>':''}${sizeLabel}
          <button class="pool-toggle" onclick="togglePool(${gi})">${collapsed ? 'Show players ▸' : 'Hide players ▾'}</button></span>
        <span class="gavg">avg <b>${avg.toFixed(2)}</b></span>
      </div>
      <div class="proster">${g.map((x, j) => `
        <div class="grow">
          <span class="gleft">${dispName(x.p.name)}${x.exact?"":" <span class='partial' title='Estimated rating'>*</span>"}<span class="nrec" data-name="${x.p.name.replace(/"/g,'&quot;')}" style="display:none"></span></span>
          <span class="gr">${x.p.d ?? x.val.toFixed(2)}</span>
        </div>`).join("")}</div>
      ${matchCardsHTML(g, gi)}`;
    cont.appendChild(card);
  });
  wrap.appendChild(cont);
  // initial standings + winner trophies for every playable group (4 or 5)
  lastGroups.forEach((g, gi) => { if (rotation(g.length)){ renderStandings(gi); renderGroupRecords(gi); } });
  paintAllWinners();
  const basis = archive.length === 0
    ? `<b>Week 1</b>: pools seeded by DUPR, highest first.`
    : `<b>Week ${Math.min(archive.length+1, SEASON_WEEKS)}</b>: pools seeded by the overall Rating — a weighted blend of games-weighted win rate, strength of wins, and scoring margin.`;
  $("legend").innerHTML = `${basis} Pool 1 is the top pool. ` +
    `New players with no record yet seed at the bottom. ` +
    `<span class="partial">*</span> = Not Rated. Saved automatically on this device.`;
}

// ---- backup / restore (save your season to a file, load it back) ----
function backupData(){
  saveState();
  const data = localStorage.getItem(STORE_KEY) || "{}";
  const blob = new Blob([data], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `thursday-mens-league-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function restoreData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try { JSON.parse(reader.result); } catch(e){ alert("That doesn't look like a valid backup file."); return; }
    if (!confirm("Restore this backup? It replaces all data currently saved in this browser (check-ins, scores, season history).")) return;
    try { localStorage.setItem(STORE_KEY, reader.result); } catch(e){ alert("Couldn't save the restored data."); return; }
    location.reload();
  };
  reader.readAsText(file);
}

// ---- wiring ----
$("search").addEventListener("input", renderRoster);
$("backupBtn").onclick = backupData;
$("restoreBtn").onclick = () => $("restoreFile").click();
$("restoreFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) restoreData(f); e.target.value = ""; });
$("addBtn").onclick = addPlayer;
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });
$("newRating").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });
$("genBtn").onclick = generate;
$("rosterToggle").onclick = () => setRosterCollapsed(!rosterCollapsed);
$("rosterMini").onclick = () => setRosterCollapsed(false);
$("allBtn").onclick = () => { PLAYERS.forEach((_,i)=>checkedIn.add(i)); update(); };
$("resetBtn").onclick = () => {
  if (!confirm("Clear all check-ins, groups, scores, and court rotation?")) return;
  checkedIn.clear(); lastGroups = null; scores = {}; courtState = null;
  setRosterCollapsed(false);
  update(); renderGroups(); renderCourts();
};
$("printBtn").onclick = () => { if(!lastGroups){ generate(); } window.print(); };

// Single delegated handler for every score box (court cards + match cards stay in
// sync and standings refresh live as you type).
document.addEventListener("input", e => {
  const t = e.target;
  if (!(t instanceof HTMLInputElement) || t.dataset.score == null) return;
  const k = t.dataset.score, v = t.value;
  if (v === "") delete scores[k]; else scores[k] = v;
  document.querySelectorAll(`input[data-score="${k}"]`).forEach(inp => { if (inp !== t) inp.value = v; });
  saveState();
  const m = k.match(/^g(\d+)-(\d+)-/);
  if (m){ renderStandings(+m[1]); renderGroupRecords(+m[1]); paintWinner(+m[1], +m[2]); }
  renderEstimate();
  renderSeason();   // roll tonight's live results into the season leaderboard
});
// The live court rotation advances only once a box is FINISHED (blur or Enter), not on
// every keystroke — otherwise typing "10" would submit at the "1". Pressing Enter also
// commits so a quick keyboard entry still advances.
document.addEventListener("change", e => {
  const t = e.target;
  if (!(t instanceof HTMLInputElement) || t.dataset.score == null) return;
  maybeAdvance(t.dataset.score);
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t instanceof HTMLInputElement && t.dataset.score != null) t.blur();
});

// ---- startup: restore saved session ----
loadState();
reconcileCourts();
update();
renderGroups();
renderCourts();
renderSeason();
applyRosterCollapsed();
</script>
<script>
(function(){
var KEY='pickleball-mens-thu-v1', API="/api/state/thursday-mens";
var origSet=localStorage.setItem.bind(localStorage), t=null;
function doPut(v){ return fetch(API,{method:"PUT",headers:{"content-type":"application/json","x-pin":localStorage.getItem("rt-pin")||""},body:JSON.stringify({data:v})}); }
function push(v){ clearTimeout(t); t=setTimeout(function(){ doPut(v).then(function(r){ if(r.status===403){ var p=prompt("Enter PIN to save changes:"); if(p!==null&&p!==""){ origSet("rt-pin",p); doPut(v); } } }).catch(function(){}); },800); }
localStorage.setItem=function(k,v){ origSet(k,v); if(k===KEY) push(v); };
fetch(API).then(function(r){return r.ok?r.json():null}).then(function(row){
if(!row||typeof row.data!=="string") return;
var local=localStorage.getItem(KEY);
if(local===row.data){ sessionStorage.removeItem("rt-cloud-sync"); return; }
if(!sessionStorage.getItem("rt-cloud-sync")){ origSet(KEY,row.data); sessionStorage.setItem("rt-cloud-sync","1"); location.reload(); }
else { sessionStorage.removeItem("rt-cloud-sync"); push(local); }
}).catch(function(){});
})();
